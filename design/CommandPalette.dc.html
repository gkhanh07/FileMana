<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="_ds/industry-e2a31009-9559-4359-bac4-1b0ef50a1405/styles.css"><script src="_ds/industry-e2a31009-9559-4359-bac4-1b0ef50a1405/_ds_bundle.js"></script><script src="icons.js"></script></helmet>
<div style="position:absolute;inset:0;background:color-mix(in srgb,var(--color-neutral-900) 28%,transparent);font-family:var(--font-body);color:var(--color-text);font-size:14px;line-height:1.4">
  <div role="dialog" aria-label="Tìm kiếm" class="blueprint" style="position:absolute;top:96px;left:50%;transform:translateX(-50%);width:640px;background:var(--color-bg);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--color-text) 22%,transparent)">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <div style="height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--color-divider)">
      <span style="display:flex;color:var(--color-neutral-700)"><lu-i name="search" size="18"></lu-i></span>
      <span style="flex:1;font-size:16px">trang<span style="display:inline-block;width:1.5px;height:20px;vertical-align:-4px;margin-left:1px;background:var(--color-accent)"></span></span>
      <kbd style="font:500 11px var(--font-body);height:20px;padding:0 6px;display:grid;place-items:center;border:1px solid var(--color-divider);color:var(--color-neutral-700)">Esc</kbd>
    </div>
    <div style="padding:4px 0">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
        <div style="padding:4px 6px">
          <div style="height:28px;display:flex;align-items:center;padding:0 10px;font-size:12px;color:var(--color-neutral-700)">{{ g.label }}</div>
          <sc-for list="{{ g.items }}" as="r" hint-placeholder-count="2">
            <div style="position:relative;height:36px;display:flex;align-items:center;gap:12px;padding:0 10px;background:{{ r.bg }};cursor:pointer" style-hover="background:color-mix(in srgb,var(--color-text) 5%,transparent)">
              <sc-if value="{{ r.sel }}"><span style="position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--color-accent)"></span></sc-if>
              <sc-if value="{{ r.avatar }}"><span style="width:18px;height:18px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:500;background:color-mix(in oklch, oklch(0.7 0.09 80) 40%, var(--color-bg))">T</span></sc-if>
              <sc-if value="{{ r.square }}"><span style="width:16px;height:16px;flex:none;display:grid;place-items:center;font:600 10px var(--font-heading);color:var(--color-bg);background:oklch(0.6 0.11 255)">W</span></sc-if>
              <sc-if value="{{ r.icon }}"><span style="display:flex;color:var(--color-neutral-700)"><lu-i name="{{ r.icon }}"></lu-i></span></sc-if>
              <span style="white-space:nowrap">{{ r.a }}<b style="font-weight:600">{{ r.b }}</b>{{ r.c }}</span>
              <span style="font-size:12px;color:var(--color-neutral-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1">{{ r.loc }}</span>
              <span style="font-size:12px;color:var(--color-neutral-700);white-space:nowrap">{{ r.time }}</span>
              <sc-if value="{{ r.keys }}"><kbd style="font:500 11px var(--font-body);height:20px;padding:0 5px;display:grid;place-items:center;border:1px solid var(--color-divider);color:var(--color-neutral-800)">{{ r.keys }}</kbd></sc-if>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
    <div style="height:36px;display:flex;align-items:center;gap:16px;padding:0 16px;border-top:1px solid var(--color-divider);font-size:12px;color:var(--color-neutral-700)">
      <span>↑↓ di chuyển</span><span>↵ mở</span><span>⌘↵ mở trong panel</span><span style="margin-left:auto">Tab lọc theo loại</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    const it = (o) => ({ a: '', b: '', c: '', loc: '', time: '', ...o, bg: o.sel ? 'color-mix(in srgb,var(--color-text) 7%,transparent)' : 'transparent' });
    const groups = [
      { label: 'Việc', items: [
        it({ icon: 'st-progress', a: 'Thiết kế ', b: 'trang', c: ' chủ – phiên bản mobile', loc: 'WEB-124 · Website Redesign', time: '2 giờ trước', sel: 1, keys: '↵' }),
        it({ icon: 'st-progress', a: 'Chốt bố cục ', b: 'trang', c: ' Bảng giá', loc: 'WEB-118 · Website Redesign', time: 'Hôm qua' }),
        it({ icon: 'st-review', a: 'Viết lại nội dung ', b: 'trang', c: ' Giới thiệu', loc: 'WEB-129 · Website Redesign', time: '4 giờ trước' })] },
      { label: 'Dự án', items: [it({ square: 1, a: 'Website Redesign', loc: 'Mô tả: “… ' + 'trang chủ, bảng giá, blog …”', time: '1 giờ trước' })] },
      { label: 'Tài liệu & tệp', items: [
        it({ icon: 'file-text', a: 'Ghi chú: cấu trúc ', b: 'trang', c: ' chủ', loc: 'Website Redesign · Tài liệu', time: '3 ngày trước' }),
        it({ icon: 'file', a: 'Bang-gia-', b: 'trang', c: '-web.pdf', loc: 'Chiến dịch Marketing Q4 · 1,4 MB', time: '1 tuần trước' })] },
      { label: 'Người', items: [it({ avatar: 1, b: 'Trang', loc: 'Vận hành · trang@maystudio.vn' })] },
      { label: 'Hành động', items: [it({ icon: 'square-pen', a: 'Tạo việc', keys: 'C' }), it({ icon: 'inbox', a: 'Đi tới Hộp thư', keys: 'G I' })] }
    ];
    return { groups };
  }
}
</script>
</body>
</html>
