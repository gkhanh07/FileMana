<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="_ds/industry-e2a31009-9559-4359-bac4-1b0ef50a1405/styles.css"><script src="_ds/industry-e2a31009-9559-4359-bac4-1b0ef50a1405/_ds_bundle.js"></script><script src="icons.js"></script></helmet>
<div style="width:100%;height:100%;display:grid;grid-template-columns:240px minmax(0,1fr);background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:14px;line-height:1.45;overflow:hidden">
  <dc-import name="Sidebar" active="projects" hint-size="240px,100%"></dc-import>
  <div style="display:grid;grid-template-rows:52px minmax(0,1fr);min-width:0">
    <dc-import name="Topbar" crumbs="Dự án" hint-size="100%,52px"></dc-import>
    <main style="overflow:hidden;padding:28px 32px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
        <h1 style="font-size:24px;margin:0">Dự án</h1>
        <span style="font-size:13px;color:var(--color-neutral-700)">7</span>
        <button class="btn btn-secondary" style="height:32px;margin-left:auto;gap:8px"><lu-i name="plus"></lu-i>Dự án mới</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <div style="display:flex;gap:2px">
          <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
            <span style="height:28px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:13px;cursor:pointer;border:1px solid {{ f.border }};background:{{ f.bg }};font-weight:{{ f.weight }}" style-hover="background:color-mix(in srgb,var(--color-text) 6%,transparent)">{{ f.label }}<span style="font-size:12px;color:var(--color-neutral-700)">{{ f.n }}</span></span>
          </sc-for>
        </div>
        <span style="margin-left:auto;display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;font-size:13px;color:var(--color-neutral-700);cursor:pointer" style-hover="background:color-mix(in srgb,var(--color-text) 6%,transparent)"><lu-i name="arrow-up-down" size="14"></lu-i>Hạn gần nhất</span>
        <div style="display:flex;border:1px solid var(--color-divider)">
          <span title="Danh sách" style="width:28px;height:26px;display:grid;place-items:center;background:color-mix(in srgb,var(--color-text) 8%,transparent)"><lu-i name="list"></lu-i></span>
          <span title="Lưới" style="width:28px;height:26px;display:grid;place-items:center;color:var(--color-neutral-700);border-left:1px solid var(--color-divider)"><lu-i name="layout-grid"></lu-i></span>
        </div>
      </div>
      <div role="table" style="border-top:1px solid var(--color-divider)">
        <div style="height:32px;display:grid;grid-template-columns:minmax(0,1fr) 150px 170px 80px 90px 120px 130px 32px;gap:16px;align-items:center;padding:0 8px;border-bottom:1px solid var(--color-divider);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-neutral-700)">
          <span>Tên dự án</span><span>Phụ trách</span><span>Tiến độ</span><span>Việc</span><span>Hạn</span><span>Thành viên</span><span>Trạng thái</span><span></span>
        </div>
        <sc-for list="{{ projects }}" as="p" hint-placeholder-count="7">
          <div style="height:40px;display:grid;grid-template-columns:minmax(0,1fr) 150px 170px 80px 90px 120px 130px 32px;gap:16px;align-items:center;padding:0 8px;border-bottom:1px solid color-mix(in srgb,var(--color-text) 7%,transparent);background:{{ p.bg }};cursor:pointer" style-hover="background:color-mix(in srgb,var(--color-text) 4%,transparent)">
            <span style="display:flex;align-items:center;gap:10px;min-width:0"><span style="width:20px;height:20px;flex:none;display:grid;place-items:center;font:600 12px var(--font-heading);color:var(--color-bg);background:{{ p.color }}">{{ p.init }}</span><span style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.name }}</span></span>
            <span style="display:flex;align-items:center;gap:8px;font-size:13px"><span style="width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:500;background:{{ p.ownerAv }}">{{ p.ownerInit }}</span>{{ p.owner }}</span>
            <span style="display:flex;align-items:center;gap:10px"><span style="flex:1;height:2px;background:var(--color-neutral-200)"><span style="display:block;height:2px;width:{{ p.w }};background:var(--color-neutral-800)"></span></span><span style="width:34px;text-align:right;font-size:12px;color:var(--color-neutral-700);font-variant-numeric:tabular-nums">{{ p.pct }}%</span></span>
            <span style="font-size:13px;font-variant-numeric:tabular-nums">{{ p.done }}<span style="color:var(--color-neutral-700)">/{{ p.total }}</span></span>
            <span style="font-size:13px;color:{{ p.dueColor }}">{{ p.due }}</span>
            <span style="display:flex;align-items:center"><sc-for list="{{ p.members }}" as="m"><span style="width:22px;height:22px;margin-right:-5px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:500;box-shadow:0 0 0 2px var(--color-bg);background:{{ m.av }}">{{ m.init }}</span></sc-for><sc-if value="{{ p.more }}"><span style="margin-left:10px;font-size:12px;color:var(--color-neutral-700)">+{{ p.more }}</span></sc-if></span>
            <span style="display:flex;align-items:center;gap:8px;font-size:13px"><lu-i name="{{ p.stIcon }}"></lu-i>{{ p.status }}</span>
            <span style="display:grid;place-items:center;color:var(--color-neutral-700);opacity:{{ p.menuOp }}"><lu-i name="ellipsis"></lu-i></span>
          </div>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    const H = { Khánh: 250, Minh: 160, An: 30, Linh: 330, Huy: 200, Trang: 80, Phúc: 120, Ngọc: 290, Duy: 220, Vy: 0 };
    const av = (n) => ({ init: n[0], av: `color-mix(in oklch, oklch(0.7 0.09 ${H[n]}) 40%, var(--color-bg))` });
    const S = { plan: ['st-planning', 'Lên kế hoạch'], act: ['st-active', 'Đang chạy'], hold: ['st-hold', 'Tạm dừng'], done: ['st-done', 'Hoàn thành'] };
    const projects = [
      ['Website Redesign', 'oklch(0.6 0.11 255)', 'Khánh', 18, 25, '30/10', 'soon', ['Khánh', 'An', 'Duy', 'Ngọc'], 2, 'act'],
      ['Ứng dụng CloudHub', 'oklch(0.64 0.11 175)', 'Minh', 27, 60, '15/12', '', ['Minh', 'Huy', 'Phúc', 'Khánh'], 1, 'act'],
      ['Chiến dịch Marketing Q4', 'oklch(0.7 0.13 60)', 'Linh', 4, 20, '31/12', '', ['Linh', 'Vy', 'Ngọc'], 0, 'act'],
      ['Vận hành nội bộ', 'oklch(0.58 0.1 320)', 'Trang', 36, 40, '—', '', ['Trang', 'Khánh'], 0, 'act'],
      ['Bộ nhận diện thương hiệu 2026', 'oklch(0.6 0.12 25)', 'An', 0, 12, '20/01', '', ['An', 'Linh'], 0, 'plan'],
      ['Cổng thông tin đối tác', 'oklch(0.6 0.04 250)', 'Huy', 10, 30, '—', '', ['Huy', 'Duy', 'Minh'], 0, 'hold'],
      ['Landing page CloudHub beta', 'oklch(0.62 0.1 135)', 'Vy', 14, 14, '28/09', '', ['Vy', 'Phúc'], 0, 'done']
    ].map(([name, color, owner, done, total, due, dk, mem, more, s], i) => {
      const pct = Math.round(done / total * 100); const o = av(owner);
      return { name, color, init: name[0], owner, ownerInit: o.init, ownerAv: o.av, done, total, pct, w: pct + '%', due,
        dueColor: dk === 'soon' ? 'var(--st-due-text)' : 'var(--color-text)', members: mem.map(av), more,
        stIcon: S[s][0], status: S[s][1], bg: i === 1 ? 'color-mix(in srgb,var(--color-text) 4%,transparent)' : 'transparent', menuOp: i === 1 ? 1 : 0 };
    });
    const filters = [['Tất cả', 7, 1], ['Đang chạy', 4], ['Lên kế hoạch', 1], ['Tạm dừng', 1], ['Hoàn thành', 1]]
      .map(([label, n, on]) => ({ label, n, bg: on ? 'color-mix(in srgb,var(--color-text) 8%,transparent)' : 'transparent', border: on ? 'var(--color-divider)' : 'transparent', weight: on ? 500 : 400 }));
    return { projects, filters };
  }
}
</script>
</body>
</html>
