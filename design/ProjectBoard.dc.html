<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="_ds/industry-e2a31009-9559-4359-bac4-1b0ef50a1405/styles.css"><script src="_ds/industry-e2a31009-9559-4359-bac4-1b0ef50a1405/_ds_bundle.js"></script><script src="icons.js"></script></helmet>
<div style="width:100%;height:100%;display:grid;grid-template-columns:240px minmax(0,1fr);background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:14px;line-height:1.45;overflow:hidden">
  <dc-import name="Sidebar" active="web" hint-size="240px,100%"></dc-import>
  <div style="display:grid;grid-template-rows:52px minmax(0,1fr);min-width:0">
    <dc-import name="Topbar" crumbs="Dự án / Website Redesign / Công việc" hint-size="100%,52px"></dc-import>
    <div style="display:flex;flex-direction:column;min-height:0">
      <dc-import name="ProjectHeader" tab="tasks" hint-size="100%,130px"></dc-import>
      <div style="height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 24px">
        <div style="display:flex;border:1px solid var(--color-divider);font-size:13px">
          <span style="height:26px;display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--color-neutral-700);cursor:pointer"><lu-i name="list" size="14"></lu-i>Danh sách</span>
          <span style="height:26px;display:flex;align-items:center;gap:6px;padding:0 10px;border-left:1px solid var(--color-divider);background:color-mix(in srgb,var(--color-text) 8%,transparent);font-weight:500"><lu-i name="kanban" size="14"></lu-i>Bảng</span>
        </div>
        <span style="height:28px;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:13px;color:var(--color-neutral-700)"><lu-i name="list-filter" size="14"></lu-i>Lọc</span>
        <span style="height:28px;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:13px;color:var(--color-neutral-700)"><lu-i name="sliders-horizontal" size="14"></lu-i>Hiển thị</span>
        <span style="margin-left:auto;font-size:12px;color:var(--color-neutral-700)">Kéo thẻ để đổi trạng thái</span>
      </div>
      <div style="flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:0 24px 24px">
        <sc-for list="{{ cols }}" as="c" hint-placeholder-count="4">
          <section style="display:flex;flex-direction:column;gap:8px;padding:4px 8px 8px;background:color-mix(in srgb,var(--color-text) 3%,transparent);min-height:0">
            <div style="height:36px;display:flex;align-items:center;gap:8px;padding:0 4px">
              <lu-i name="{{ c.icon }}"></lu-i><span style="font-size:13px;font-weight:500">{{ c.label }}</span><span style="font-size:12px;color:var(--color-neutral-700)">{{ c.n }}</span>
              <span style="margin-left:auto;width:28px;height:28px;display:grid;place-items:center;color:var(--color-neutral-700)"><lu-i name="plus"></lu-i></span>
            </div>
            <sc-for list="{{ c.cards }}" as="k" hint-placeholder-count="2">
              <article style="display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--color-bg);border:1px solid var(--color-divider);cursor:grab" style-hover="border-color:color-mix(in srgb,var(--color-text) 30%,transparent)">
                <div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;color:var(--color-neutral-700);font-variant-numeric:tabular-nums">{{ k.id }}</span><span style="margin-left:auto;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:500;background:{{ k.av }}">{{ k.init }}</span></div>
                <div style="font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:{{ k.titleColor }}">{{ k.title }}</div>
                <div style="display:flex;align-items:center;gap:10px;font-size:12px;color:var(--color-neutral-700)">
                  <span style="display:flex"><lu-i name="{{ k.pr }}" size="14"></lu-i></span>
                  <span style="display:flex;align-items:center;gap:4px;color:{{ k.dueColor }};font-weight:{{ k.dueWeight }}"><lu-i name="calendar" size="12"></lu-i>{{ k.due }}</span>
                  <span style="margin-left:auto;display:flex;align-items:center;gap:3px;opacity:{{ k.cmOp }}"><lu-i name="message-square" size="12"></lu-i>{{ k.cm }}</span>
                  <span style="display:flex;align-items:center;gap:3px;opacity:{{ k.atOp }}"><lu-i name="paperclip" size="12"></lu-i>{{ k.at }}</span>
                </div>
              </article>
            </sc-for>
            <sc-if value="{{ c.drop }}">
              <div style="position:relative;height:98px;border:1px dashed var(--color-accent);background:color-mix(in srgb,var(--color-accent) 7%,transparent)">
                <article style="position:absolute;top:12px;left:18px;width:100%;transform:rotate(2.5deg);display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--color-bg);border:1px solid color-mix(in srgb,var(--color-text) 30%,transparent);box-shadow:var(--shadow-lg);cursor:grabbing;z-index:3">
                  <div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;color:var(--color-neutral-700)">WEB-127</span><span style="margin-left:auto;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:500;background:color-mix(in oklch, oklch(0.7 0.09 220) 40%, var(--color-bg))">D</span></div>
                  <div style="font-size:13px;line-height:1.4">Xây dựng component Header &amp; Footer</div>
                  <div style="display:flex;align-items:center;gap:10px;font-size:12px;color:var(--color-neutral-700)"><span style="display:flex"><lu-i name="p-medium" size="14"></lu-i></span><span style="display:flex;align-items:center;gap:4px;color:var(--st-due-text);font-weight:500"><lu-i name="calendar" size="12"></lu-i>Thứ 4</span><span style="margin-left:auto;display:flex;align-items:center;gap:3px"><lu-i name="message-square" size="12"></lu-i>2</span><span style="display:flex;align-items:center;gap:3px"><lu-i name="paperclip" size="12"></lu-i>1</span></div>
                </article>
              </div>
            </sc-if>
            <sc-if value="{{ c.more }}"><div style="height:28px;display:flex;align-items:center;padding:0 4px;font-size:12px;color:var(--color-neutral-700)">+ {{ c.more }} việc đã xong · <a href="#" style="margin-left:4px;text-decoration:none">Xem tất cả</a></div></sc-if>
            <div style="height:32px;display:flex;align-items:center;gap:8px;padding:0 6px;font-size:13px;color:var(--color-neutral-700);cursor:pointer" style-hover="background:color-mix(in srgb,var(--color-text) 6%,transparent);color:var(--color-text)"><lu-i name="plus" size="14"></lu-i>Thêm việc</div>
          </section>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    const H = { Khánh: 250, An: 30, Duy: 220, Ngọc: 290, Huy: 200, Phúc: 120 };
    const PR = { u: 'p-urgent', h: 'p-high', m: 'p-medium', l: 'p-low' };
    const DUE = { over: ['var(--st-red)', 500], soon: ['var(--st-due-text)', 500], norm: ['var(--color-neutral-700)', 400] };
    const k = (id, title, p, who, due, dk, cm, at, done) => ({ id, title, pr: PR[p], init: who[0], av: `color-mix(in oklch, oklch(0.7 0.09 ${H[who]}) 40%, var(--color-bg))`,
      due, dueColor: DUE[dk][0], dueWeight: DUE[dk][1], cm, at, cmOp: cm ? 1 : 0, atOp: at ? 1 : 0, titleColor: done ? 'var(--color-neutral-700)' : 'var(--color-text)' });
    const cols = [
      { icon: 'st-todo', label: 'Cần làm', n: 3, cards: [
        k('WEB-135', 'Sửa lỗi menu di động bị che trên Safari iOS', 'u', 'Huy', '10/10', 'over', 2, 1),
        k('WEB-131', 'Chuẩn hoá bộ icon cho hệ thống thiết kế', 'm', 'Khánh', 'Ngày mai', 'soon', 1, 0),
        k('WEB-133', 'Kiểm tra khả năng truy cập (tương phản, focus)', 'l', 'Khánh', 'Thứ 6', 'norm', 0, 0)] },
      { icon: 'st-progress', label: 'Đang làm', n: 2, cards: [
        k('WEB-124', 'Thiết kế trang chủ – phiên bản mobile', 'h', 'Khánh', 'Hôm nay', 'soon', 4, 2),
        k('WEB-118', 'Chốt bố cục trang Bảng giá', 'h', 'Khánh', '09/10', 'over', 6, 1)] },
      { icon: 'st-review', label: 'Review', n: 2, drop: true, cards: [
        k('WEB-129', 'Viết lại nội dung trang Giới thiệu', 'm', 'Ngọc', 'Thứ 6', 'norm', 3, 0)] },
      { icon: 'st-done', label: 'Xong', n: 18, more: 15, cards: [
        k('WEB-130', 'Tối ưu ảnh hero (WebP, lazy-load)', 'l', 'Phúc', '10/10', 'norm', 1, 0, 1),
        k('WEB-126', 'Thiết lập CMS cho blog', 'm', 'Huy', '08/10', 'norm', 0, 0, 1),
        k('WEB-122', 'Sitemap v2 sau góp ý của khách', 'm', 'An', '02/10', 'norm', 5, 1, 1)] }
    ];
    return { cols };
  }
}
</script>
</body>
</html>
