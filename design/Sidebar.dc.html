<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="_ds/industry-e2a31009-9559-4359-bac4-1b0ef50a1405/styles.css"><script src="_ds/industry-e2a31009-9559-4359-bac4-1b0ef50a1405/_ds_bundle.js"></script><script src="icons.js"></script></helmet>
<sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
<aside style="width:240px;height:100%;display:flex;flex-direction:column;background:var(--color-surface);border-right:1px solid var(--color-divider);font-size:14px;color:var(--color-text)">
  <div style="height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px">
    <span style="width:24px;height:24px;display:grid;place-items:center;background:var(--color-text);color:var(--color-bg);font-family:var(--font-heading);font-weight:600;font-size:15px">M</span>
    <span style="font-weight:500;flex:1">Mây Studio</span>
    <span title="Thu gọn  [" style="width:28px;height:28px;display:grid;place-items:center;color:var(--color-neutral-700);cursor:pointer" style-hover="background:color-mix(in srgb,var(--color-text) 7%,transparent)"><lu-i name="panel-left"></lu-i></span>
  </div>
  <nav style="display:flex;flex-direction:column;gap:2px;padding:4px 8px">
    <sc-for list="{{ nav }}" as="it" hint-placeholder-count="5">
      <div style="position:relative;height:32px;display:flex;align-items:center;padding:0 8px;cursor:pointer" style-hover="background:color-mix(in srgb,var(--color-text) 5%,transparent)">
        <sc-if value="{{ it.active }}"><span style="position:absolute;inset:0;background:color-mix(in srgb,var(--color-text) 8%,transparent)"></span><span style="position:absolute;left:0;top:7px;bottom:7px;width:2px;background:var(--color-accent)"></span></sc-if>
        <span style="position:relative;display:flex;align-items:center;gap:10px;flex:1;min-width:0">
          <span style="display:flex;color:{{ it.iconColor }}"><lu-i name="{{ it.icon }}"></lu-i></span>
          <span style="flex:1;font-weight:{{ it.weight }}">{{ it.label }}</span>
          <sc-if value="{{ it.count }}"><span style="font-size:12px;font-weight:500;min-width:20px;height:18px;padding:0 6px;display:grid;place-items:center;background:var(--color-text);color:var(--color-bg)">{{ it.count }}</span></sc-if>
        </span>
      </div>
    </sc-for>
  </nav>
  <div style="display:flex;flex-direction:column;gap:2px;padding:16px 8px 4px">
    <div style="height:28px;display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:500;color:var(--color-neutral-700)">Yêu thích</div>
    <sc-for list="{{ favs }}" as="f" hint-placeholder-count="4">
      <div style="position:relative;height:32px;display:flex;align-items:center;padding:0 8px;cursor:pointer" style-hover="background:color-mix(in srgb,var(--color-text) 5%,transparent)">
        <sc-if value="{{ f.active }}"><span style="position:absolute;inset:0;background:color-mix(in srgb,var(--color-text) 8%,transparent)"></span><span style="position:absolute;left:0;top:7px;bottom:7px;width:2px;background:var(--color-accent)"></span></sc-if>
        <span style="position:relative;display:flex;align-items:center;gap:12px;flex:1;min-width:0">
          <span style="width:8px;height:8px;margin:0 4px;flex:none;background:{{ f.color }}"></span>
          <span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:{{ f.weight }}">{{ f.name }}</span>
        </span>
      </div>
    </sc-for>
  </div>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:2px;padding:8px">
    <div style="height:32px;display:flex;align-items:center;gap:10px;padding:0 8px;cursor:pointer" style-hover="background:color-mix(in srgb,var(--color-text) 5%,transparent)"><span style="display:flex;color:var(--color-neutral-700)"><lu-i name="settings"></lu-i></span><span>Cài đặt</span></div>
    <div style="height:44px;display:flex;align-items:center;gap:10px;padding:0 8px;border-top:1px solid var(--color-divider);margin-top:4px;padding-top:4px">
      <span style="width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:500;background:color-mix(in oklch, oklch(0.7 0.09 250) 40%, var(--color-bg))">K</span>
      <span style="display:flex;flex-direction:column;line-height:1.2;flex:1"><span style="font-size:13px;font-weight:500">Khánh</span><span style="font-size:12px;color:var(--color-neutral-700)">Admin</span></span>
      <span style="display:flex;color:var(--color-neutral-700)"><lu-i name="chevrons-up-down"></lu-i></span>
    </div>
  </div>
</aside>
</sc-if>
<sc-if value="{{ collapsed }}">
<aside style="width:56px;height:100%;display:flex;flex-direction:column;align-items:center;background:var(--color-surface);border-right:1px solid var(--color-divider);color:var(--color-text)">
  <div style="height:52px;flex:none;display:grid;place-items:center"><span style="width:24px;height:24px;display:grid;place-items:center;background:var(--color-text);color:var(--color-bg);font-family:var(--font-heading);font-weight:600;font-size:15px">M</span></div>
  <nav style="display:flex;flex-direction:column;gap:2px;padding:4px 0">
    <sc-for list="{{ nav }}" as="it" hint-placeholder-count="5">
      <div title="{{ it.label }}" style="position:relative;width:36px;height:32px;display:grid;place-items:center;cursor:pointer" style-hover="background:color-mix(in srgb,var(--color-text) 5%,transparent)">
        <sc-if value="{{ it.active }}"><span style="position:absolute;inset:0;background:color-mix(in srgb,var(--color-text) 8%,transparent)"></span><span style="position:absolute;left:-10px;top:7px;bottom:7px;width:2px;background:var(--color-accent)"></span></sc-if>
        <span style="position:relative;display:flex;color:{{ it.iconColor }}"><lu-i name="{{ it.icon }}"></lu-i></span>
        <sc-if value="{{ it.count }}"><span style="position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--color-text);box-shadow:0 0 0 2px var(--color-surface)"></span></sc-if>
      </div>
    </sc-for>
  </nav>
  <div style="display:flex;flex-direction:column;gap:2px;padding:12px 0;border-top:1px solid var(--color-divider);margin-top:8px">
    <sc-for list="{{ favs }}" as="f" hint-placeholder-count="4">
      <div title="{{ f.name }}" style="width:36px;height:32px;display:grid;place-items:center;cursor:pointer" style-hover="background:color-mix(in srgb,var(--color-text) 5%,transparent)"><span style="width:8px;height:8px;background:{{ f.color }}"></span></div>
    </sc-for>
  </div>
  <div style="margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 12px">
    <div style="width:36px;height:32px;display:grid;place-items:center;color:var(--color-neutral-700)"><lu-i name="panel-left"></lu-i></div>
    <span style="width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:500;background:color-mix(in oklch, oklch(0.7 0.09 250) 40%, var(--color-bg))">K</span>
  </div>
</aside>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;tasks&quot;,&quot;inbox&quot;,&quot;projects&quot;,&quot;docs&quot;,&quot;web&quot;,&quot;clh&quot;,&quot;mkt&quot;,&quot;ops&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;collapsed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const collapsed = !!this.props.collapsed;
    const nav = [
      ['home', 'house', 'Trang chủ'], ['tasks', 'square-check-big', 'Việc của tôi'], ['inbox', 'inbox', 'Hộp thư', 3],
      ['projects', 'folder-kanban', 'Dự án'], ['docs', 'files', 'Tài liệu']
    ].map(([k, icon, label, count]) => ({ icon, label, count, active: k === a,
      iconColor: k === a ? 'var(--color-text)' : 'var(--color-neutral-700)', weight: k === a ? 500 : 400 }));
    const favs = [
      ['web', 'Website Redesign', 'oklch(0.6 0.11 255)'], ['clh', 'Ứng dụng CloudHub', 'oklch(0.64 0.11 175)'],
      ['mkt', 'Chiến dịch Marketing Q4', 'oklch(0.7 0.13 60)'], ['ops', 'Vận hành nội bộ', 'oklch(0.58 0.1 320)']
    ].map(([k, name, color]) => ({ name, color, active: k === a, weight: k === a ? 500 : 400 }));
    return { nav, favs, collapsed, expanded: !collapsed };
  }
}
</script>
</body>
</html>
