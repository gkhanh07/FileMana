<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="_ds/industry-e2a31009-9559-4359-bac4-1b0ef50a1405/styles.css"><script src="_ds/industry-e2a31009-9559-4359-bac4-1b0ef50a1405/_ds_bundle.js"></script><script src="icons.js"></script></helmet>
<div style="position:absolute;inset:0;background:color-mix(in srgb,var(--color-neutral-900) 38%,transparent);font-family:var(--font-body);color:var(--color-text);font-size:14px;line-height:1.45">
  <div role="dialog" aria-label="Tạo việc" class="blueprint" style="position:absolute;top:150px;left:50%;transform:translateX(-50%);width:640px;background:var(--color-bg);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--color-text) 22%,transparent)">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <div style="height:44px;display:flex;align-items:center;gap:8px;padding:0 10px 0 20px;font-size:12px;color:var(--color-neutral-700)">
      <span style="height:22px;display:flex;align-items:center;gap:6px;padding:0 6px;border:1px solid var(--color-divider);color:var(--color-text)"><span style="width:8px;height:8px;background:oklch(0.6 0.11 255)"></span>WEB</span>
      <lu-i name="chevron-right" size="12"></lu-i><span>Việc mới</span>
      <span style="margin-left:auto;display:flex;gap:2px"><span title="Mở toàn màn hình" style="width:28px;height:28px;display:grid;place-items:center"><lu-i name="maximize-2" size="14"></lu-i></span><span title="Đóng  Esc" style="width:28px;height:28px;display:grid;place-items:center"><lu-i name="x"></lu-i></span></span>
    </div>
    <div style="padding:4px 20px 0">
      <div style="font:500 22px/1.3 var(--font-body);letter-spacing:-0.01em">Cập nhật ảnh nhóm trên trang Giới thiệu<span style="display:inline-block;width:1.5px;height:24px;vertical-align:-4px;margin-left:1px;background:var(--color-accent)"></span></div>
      <div style="margin-top:8px;font-size:14px;color:var(--color-neutral-600)">Thêm mô tả… (không bắt buộc)</div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;padding:20px 20px 16px">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
        <span tabindex="0" style="height:28px;display:flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--color-divider);font-size:13px;cursor:pointer;color:{{ c.color }};box-shadow:{{ c.ring }}" style-hover="background:color-mix(in srgb,var(--color-text) 6%,transparent)">
          <sc-if value="{{ c.dot }}"><span style="width:8px;height:8px;background:oklch(0.6 0.11 255)"></span></sc-if>
          <sc-if value="{{ c.avatar }}"><span style="width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:500;color:var(--color-text);background:color-mix(in oklch, oklch(0.7 0.09 250) 40%, var(--color-bg))">K</span></sc-if>
          <sc-if value="{{ c.icon }}"><span style="display:flex;color:var(--color-neutral-700)"><lu-i name="{{ c.icon }}" size="14"></lu-i></span></sc-if>
          {{ c.label }}
        </span>
      </sc-for>
    </div>
    <div style="height:56px;display:flex;align-items:center;gap:16px;padding:0 16px 0 20px;border-top:1px solid var(--color-divider);font-size:12px;color:var(--color-neutral-700)">
      <span style="display:flex;align-items:center;gap:6px"><kbd style="font:500 11px var(--font-body);height:20px;padding:0 5px;display:grid;place-items:center;border:1px solid var(--color-divider);color:var(--color-neutral-800)">↵</kbd>Tạo</span>
      <span style="display:flex;align-items:center;gap:6px"><kbd style="font:500 11px var(--font-body);height:20px;padding:0 5px;display:grid;place-items:center;border:1px solid var(--color-divider);color:var(--color-neutral-800)">⇧ ↵</kbd>Tạo và tạo tiếp</span>
      <span style="display:flex;align-items:center;gap:6px"><kbd style="font:500 11px var(--font-body);height:20px;padding:0 5px;display:grid;place-items:center;border:1px solid var(--color-divider);color:var(--color-neutral-800)">Esc</kbd>Đóng</span>
      <button class="btn btn-primary blueprint" style="margin-left:auto;height:32px;padding:0 14px;font-size:14px"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>Tạo việc</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    const chips = [
      { dot: 1, label: 'Website Redesign' }, { avatar: 1, label: 'Khánh' }, { icon: 'p-medium', label: 'Trung bình' },
      { icon: 'calendar', label: 'Hạn', muted: 1 }, { icon: 'tag', label: 'Nhãn', muted: 1 }
    ].map(c => ({ ...c, color: c.muted ? 'var(--color-neutral-700)' : 'var(--color-text)', ring: 'none' }));
    return { chips };
  }
}
</script>
</body>
</html>
