# Production on the VPS (/opt/filemana): images built by .github/workflows/deploy.yml, Caddy in front.
# Only Caddy publishes a port; db, api and web are reachable only inside the compose network.
# IMAGE_TAG (a commit sha) is written into .env by each deploy; change it there to roll back.

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # Runs on every deploy: pending migrations, then the seed (which changes nothing that exists).
  migrate:
    image: ghcr.io/gkhanh07/filemana-migrate:${IMAGE_TAG:?IMAGE_TAG missing from .env}
    command: sh -c "npx prisma migrate deploy && node dist/seed.js"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WORKSPACE_NAME: ${WORKSPACE_NAME:-FileMana}
      SEED_EMAIL: ${SEED_EMAIL}
      SEED_NAME: ${SEED_NAME}
      SEED_PASSWORD: ${SEED_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ghcr.io/gkhanh07/filemana-api:${IMAGE_TAG:?IMAGE_TAG missing from .env}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-20}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/gkhanh07/filemana-web:${IMAGE_TAG:?IMAGE_TAG missing from .env}
    restart: unless-stopped
    environment:
      API_URL: http://api:3001
    depends_on:
      - api

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      # 8080 on every interface until there is a domain; then 127.0.0.1:8080 behind the VPS's Nginx.
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api

volumes:
  db-data:
  uploads:
