services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: build
    command: sh -c "npx prisma migrate deploy && node dist/seed.js"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WORKSPACE_NAME: ${WORKSPACE_NAME:-FileMana}
      SEED_EMAIL: ${SEED_EMAIL}
      SEED_NAME: ${SEED_NAME}
      SEED_PASSWORD: ${SEED_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-20}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL missing from .env}
    restart: unless-stopped
    environment:
      API_URL: http://api:3001
    depends_on:
      - api

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api

  # Daily at 02:00 Vietnam time (19:00 UTC); see docs/operations.md. crond needs root, so this one service runs as root.
  backup:
    image: postgres:17.6-alpine
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - echo '0 19 * * * sh /scripts/backup.sh > /proc/1/fd/1 2>&1' | crontab - && exec crond -f -l 8
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - uploads:/uploads
      - ${BACKUP_DIR:-/var/backups/filemana}:/backups
      - ./scripts:/scripts:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads:
