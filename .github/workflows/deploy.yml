# main → CI → on the VPS, /opt/filemana (a clone of this repo) checks out the commit and rebuilds.
# Rollback: on the VPS, git checkout <older sha> && docker compose -f docker-compose.prod.yml up -d --build
# (a release that changed the database also needs the backup from before it).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling one halfway through.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  vps:
    needs: ci
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      # .env with the real values lives only in /opt/filemana on the VPS (git-ignored, untouched by checkout).
      # migrate runs prisma migrate deploy + the idempotent seed before api starts.
      - name: Build and restart
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            set -e
            cd /opt/filemana
            git fetch --quiet origin
            git checkout --force --detach ${{ github.sha }}
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f
          "
