# main → CI → images on GHCR tagged with the commit → the VPS pulls and restarts.
# Rollback: on the VPS, set IMAGE_TAG=<older sha> in .env, then docker compose -f docker-compose.prod.yml up -d
# (a release that changed the database also needs the backup from before it).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling one halfway through.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: api
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: true
          tags: ${{ env.REGISTRY }}/filemana-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # The one-off migrate service: Prisma CLI plus the compiled seed.
      - name: migrate
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: build
          push: true
          tags: ${{ env.REGISTRY }}/filemana-migrate:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=migrate

      - name: web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.REGISTRY }}/filemana-web:${{ github.sha }}
          # Public, baked into the browser bundle: a repository variable, not a secret.
          build-args: NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  vps:
    needs: images
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read # the VPS pulls with this job's token
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Copy compose files
        run: scp docker-compose.prod.yml Caddyfile ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/filemana/

      # .env with the real values already lives in /opt/filemana on the VPS; it never leaves it.
      # migrate runs prisma migrate deploy + the idempotent seed before api starts.
      - name: Pull and restart
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            set -e
            cd /opt/filemana
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            sed -i '/^IMAGE_TAG=/d' .env && echo 'IMAGE_TAG=${{ github.sha }}' >> .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
          "
